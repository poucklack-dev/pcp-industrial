{% extends "base.html" %}
{% block page_title %}Apontamento de produção{% endblock %}
{% block content %}
<div class="card" style="max-width:900px">
  <div class="card-header"><div><h2 class="card-title">Registrar produção</h2><div class="card-subtitle">Informe o resultado executado na ordem de produção.</div></div></div>
  <form method="post" action="{{ url_for('apontamentos.novo') }}" class="row g-3 p-3">
    <div class="col-md-7"><label class="form-label">Ordem de produção</label><select class="form-select" name="op_id" required><option value="">Selecione uma OP liberada</option>{% for op in ops %}<option value="{{ op.id }}">{{ op.numero }} — {{ op.produto.codigo }} — saldo: {{ (op.quantidade_planejada - op.quantidade_produzida)|round(2) }} {{ op.produto.unidade }}</option>{% endfor %}</select></div>
    <div class="col-md-5"><label class="form-label">Operador responsável</label><select class="form-select" name="operador_id" required>{% for operador in operadores %}<option value="{{ operador.id }}">{{ operador.nome }}</option>{% else %}<option value="">Perfil de operador não encontrado</option>{% endfor %}</select></div>
    <div class="col-md-4"><label class="form-label">Quantidade produzida</label><input class="form-control" type="number" step="0.0001" min="0.0001" name="quantidade_produzida" required></div>
    <div class="col-md-4"><label class="form-label">Quantidade boa</label><input class="form-control" type="number" step="0.0001" min="0" name="quantidade_boa" required></div>
    <div class="col-md-4"><label class="form-label">Refugo</label><input class="form-control" type="number" step="0.0001" min="0" name="quantidade_refugada" value="0"></div>
    <div class="col-md-6"><label class="form-label">Motivo do refugo</label><input class="form-control" name="motivo_refugo" placeholder="Opcional"></div>
    <div class="col-md-6"><label class="form-label">Observação</label><input class="form-control" name="observacao" placeholder="Opcional"></div>
    <div class="col-12 d-flex justify-content-end"><button class="btn btn-primary"><i class="bi bi-check2-circle me-1"></i>Registrar apontamento</button></div>
  </form>
</div>
{% endblock %}
