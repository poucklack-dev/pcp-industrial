services:
  web:
    build: .
    ports:
      - "5000:5000"
    environment:
      APP_ENV: production
      SECRET_KEY: ${SECRET_KEY:?Defina SECRET_KEY no arquivo .env}
      DATABASE_URL: postgresql+psycopg://pcp:pcp@db:5432/pcp
      ADMIN_EMAIL: ${ADMIN_EMAIL:-admin@example.com}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:?Defina ADMIN_PASSWORD no arquivo .env}
    depends_on:
      db:
        condition: service_healthy
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: pcp
      POSTGRES_USER: pcp
      POSTGRES_PASSWORD: pcp
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U pcp -d pcp"]
      interval: 5s
      timeout: 5s
      retries: 10
volumes:
  postgres_data:
